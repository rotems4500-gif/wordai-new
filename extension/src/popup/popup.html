<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>WordFlow Clipper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app" class="wf-app">
    <header class="wf-header">
      <span class="wf-logo">📎</span>
      <span class="wf-title">WordFlow Clipper</span>
    </header>

    <div id="signed-out-view" class="wf-view hidden">
      <p class="wf-hint">התחברו כדי לשלוח תוכן מהדפדפן ישירות ל-WordFlow AI.</p>
      <button id="sign-in-btn" class="wf-btn wf-btn-primary">התחברות עם Google</button>
      <p id="signed-out-error" class="wf-error hidden"></p>
    </div>

    <div id="signed-in-view" class="wf-view hidden">
      <p class="wf-user-email" id="user-email"></p>

      <div id="state-scanning" class="wf-state">
        <p class="wf-hint wf-scanning">סורק את העמוד...</p>
      </div>

      <div id="state-pdf" class="wf-state hidden">
        <p class="wf-file-line">📄 <span id="pdf-file-name"></span></p>
        <button id="send-pdf-btn" class="wf-btn wf-btn-primary">שלח PDF זה</button>
      </div>

      <div id="state-page" class="wf-state hidden">
        <div id="job-banner" class="wf-job-banner hidden">
          <span id="job-banner-text"></span>
          <button id="job-banner-dismiss" class="wf-link-btn" title="סגור">✕</button>
        </div>

        <button id="send-page-btn" class="wf-btn wf-btn-primary">שלח את העמוד הנוכחי</button>

        <div id="file-list-block" class="wf-files hidden">
          <div class="wf-files-head">
            <label class="wf-checkbox">
              <input type="checkbox" id="select-all-checkbox" />
              <span id="files-count">נמצאו 0 קבצים</span>
            </label>
          </div>
          <ul id="file-list" class="wf-file-list"></ul>
          <button id="download-selected-btn" class="wf-btn">הורד 0 נבחרים</button>
          <button id="rescan-btn" class="wf-btn wf-btn-ghost hidden">סרוק שוב את העמוד</button>
          <p id="files-summary" class="wf-status hidden"></p>
        </div>
      </div>

      <p id="send-status" class="wf-status hidden"></p>

      <fieldset class="wf-destination">
        <legend>יעד הקליפה</legend>
        <label class="wf-radio">
          <input type="radio" name="destination" value="material" />
          <span>חומר עזר</span>
        </label>
        <label class="wf-radio">
          <input type="radio" name="destination" value="source" />
          <span>מקור מצוטט</span>
        </label>
        <label class="wf-radio">
          <input type="radio" name="destination" value="inbox" />
          <span>תיבת קליפים (אישור לפני קליטה)</span>
        </label>
      </fieldset>

      <label class="wf-checkbox">
        <input type="checkbox" id="set-default-checkbox" />
        <span>קבע כברירת מחדל</span>
      </label>

      <button id="sign-out-btn" class="wf-link-btn">התנתקות</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
