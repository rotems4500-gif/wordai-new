<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>WordFlow Clipper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app" class="wf-app">
    <header class="wf-header">
      <span class="wf-logo">📎</span>
      <span class="wf-title">WordFlow Clipper</span>
    </header>

    <div id="signed-out-view" class="wf-view hidden">
      <p class="wf-hint">התחברו כדי לשלוח תוכן מהדפדפן ישירות ל-WordFlow AI.</p>
      <button id="sign-in-btn" class="wf-btn wf-btn-primary">התחברות עם Google</button>
      <p id="signed-out-error" class="wf-error hidden"></p>
    </div>

    <div id="signed-in-view" class="wf-view hidden">
      <p class="wf-user-email" id="user-email"></p>

      <button id="send-page-btn" class="wf-btn wf-btn-primary">שלח את העמוד הנוכחי</button>
      <p id="send-status" class="wf-status hidden"></p>

      <fieldset class="wf-destination">
        <legend>יעד הקליפה</legend>
        <label class="wf-radio">
          <input type="radio" name="destination" value="material" />
          <span>חומר עזר</span>
        </label>
        <label class="wf-radio">
          <input type="radio" name="destination" value="source" />
          <span>מקור מצוטט</span>
        </label>
        <label class="wf-radio">
          <input type="radio" name="destination" value="inbox" />
          <span>תיבת דואר</span>
        </label>
      </fieldset>

      <label class="wf-checkbox">
        <input type="checkbox" id="set-default-checkbox" />
        <span>קבע כברירת מחדל</span>
      </label>

      <button id="sign-out-btn" class="wf-link-btn">התנתקות</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
