name: Publish Word AI Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets['CSC_LINK'] }}
      CSC_KEY_PASSWORD: ${{ secrets['CSC_KEY_PASSWORD'] }}
      WIN_CSC_LINK: ${{ secrets['WIN_CSC_LINK'] }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets['WIN_CSC_KEY_PASSWORD'] }}

    steps:
      - name: Fail fast for manual publish without a release tag
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          throw "Manual publish runs must target a release tag matching v*. Re-run workflow_dispatch from a v* tag ref."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          # Ensure stale artifacts from reused/self-hosted runners do not lock optional native modules.
          if (Test-Path node_modules) {
            Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          }

          function Invoke-NpmInstall {
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { return 0 }

            Write-Host "npm ci failed, cleaning transient native module folders and retrying"
            Remove-Item -Recurse -Force node_modules\.lightningcss-win32-x64-msvc-* -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force node_modules\.rollup-win32-x64-msvc-* -ErrorAction SilentlyContinue

            npm install --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { return 0 }

            Write-Host "npm install failed, last retry with npm ci"
            npm ci --no-audit --no-fund
            return $LASTEXITCODE
          }

          $result = Invoke-NpmInstall
          if ($result -ne 0) {
            exit $result
          }

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $tagVersion = "${env:GITHUB_REF_NAME}".TrimStart('v')
          if ($pkg.version -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package.json version $($pkg.version)"
          }

      - name: Validate signing configuration for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $hasGenericSigning = -not [string]::IsNullOrWhiteSpace($env:CSC_LINK) -and -not [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)
          $hasWindowsSigning = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -and -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)

          if (-not ($hasGenericSigning -or $hasWindowsSigning)) {
            throw "Tagged releases require Windows code signing secrets. Set WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD, or CSC_LINK and CSC_KEY_PASSWORD."
          }

      - name: Clean previous release files
        shell: pwsh
        run: |
          if (Test-Path release) {
            Get-ChildItem release -Force | Remove-Item -Recurse -Force
          }

      - name: Build Windows installer and update metadata
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win --publish never --config.win.signAndEditExecutable=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $latest = Get-Content release/latest.yml -Raw
          $pkg = Get-Content package.json | ConvertFrom-Json
          if ($latest -notmatch "version:\s+$($pkg.version)") {
            throw "latest.yml version does not match package.json version $($pkg.version)"
          }

      - name: Create GitHub release and upload assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
