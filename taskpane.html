<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://appsforoffice.microsoft.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self' https://*.microsoft.com https://*.office.com https://*.oaspapps.com; media-src 'self' data: blob:;" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WordFlow AI — תוסף Word</title>
    <link rel="icon" type="image/png" href="/addin/icon-32.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Heebo:wght@400;500;700&display=swap" />
    <!-- office.js חייב להיטען מה-CDN של מיקרוסופט (דרישת AppSource), חוסם, לפני ה-bundle -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
    <div id="addin-root" style="padding:16px;font-family:sans-serif;font-size:13px;color:#64748b">טוען את WordFlow AI...</div>
    <script>
      // רשת ביטחון: קריסה לפני/בזמן ה-mount מוצגת על המסך במקום חלונית ריקה
      window.addEventListener('error', function (e) {
        var el = document.getElementById('addin-root');
        if (el) el.innerHTML = '<div dir="rtl" style="padding:16px;font-family:sans-serif;font-size:12px;color:#b91c1c;white-space:pre-wrap;text-align:right">שגיאת טעינה:\n' + (e.message || 'unknown') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '</div>';
      });
      window.addEventListener('unhandledrejection', function (e) {
        var el = document.getElementById('addin-root');
        var msg = (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason);
        if (el) el.innerHTML = '<div dir="rtl" style="padding:16px;font-family:sans-serif;font-size:12px;color:#b91c1c;white-space:pre-wrap;text-align:right">שגיאת טעינה (promise):\n' + msg + '</div>';
      });
    </script>
    <script type="module" src="./src/addin/main.jsx"></script>
</body>
</html>
