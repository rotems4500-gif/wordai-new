<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https:; connect-src 'self' https: ws://localhost:* wss://localhost:*; worker-src 'self' blob: https://cdnjs.cloudflare.com; frame-src 'self' https://wordai-website.firebaseapp.com; media-src 'self' data: blob:;" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WordFlow AI">
    <title>WordFlow AI</title>
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- הסרת office.js בעקבות פיצול הפרויקט לאפליקציה עצמאית -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&family=Alef:wght@400;700&family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@400;500;700;800;900&family=Miriam+Libre:wght@400;700&family=Secular+One&family=Suez+One&family=Fredoka:wght@400;600&family=Karantina:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
</head>
<body class="bg-gray-50 h-[100dvh] w-screen m-0 overflow-hidden">
    <div id="app" class="h-full w-full"></div>
    <script>
      // החלת ערכת נושא מוקדם ככל האפשר כדי למנוע הבזק (FOUC).
      // לוגיקה מלאה ב-src/theme.js — כאן רק קריאה ראשונית מ-localStorage.
      (function () {
        try {
          var t = localStorage.getItem('wordflow:theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0a1422');
          }
        } catch (e) { /* localStorage חסום — ערכה בהירה */ }
      })();
    </script>
    <script>
      // מסך שגיאה חירום — מוצג כאשר ה-JS הראשי לא נטען
      window.__showCrashOverlay = function(msg) {
        const existing = document.getElementById('__crash-overlay');
        if (existing) return;
        var el = document.createElement('div');
        el.id = '__crash-overlay';
        el.style.cssText = 'position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:Arial,sans-serif;direction:rtl;padding:32px;';
        var h2 = document.createElement('h2');
        h2.style.cssText = 'color:#c0392b;margin-bottom:12px';
        h2.textContent = '⚠️ שגיאת טעינה';
        var p = document.createElement('p');
        p.style.cssText = 'max-width:600px;text-align:center;line-height:1.7;color:#333;white-space:pre-wrap;word-break:break-word;';
        p.textContent = msg || 'הממשק לא נטען. נסה לסגור ולפתוח מחדש את האפליקציה.';
        var btn = document.createElement('button');
        btn.style.cssText = 'margin-top:20px;padding:8px 22px;background:#2B579A;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px';
        btn.textContent = 'רענן';
        btn.onclick = function() { location.reload(); };
        el.appendChild(h2);
        el.appendChild(p);
        el.appendChild(btn);
        document.body.appendChild(el);
      };
      window.onerror = function(msg, src, line, col, err) {
        // התעלם משגיאות CDN חיצוני
        if (src && (src.indexOf('cdnjs.cloudflare.com') !== -1 || src.indexOf('unpkg.com') !== -1)) return;
        var detail = (err && err.stack) ? err.stack : (msg + ' (' + src + ':' + line + ')');
        window.__showCrashOverlay(detail);
      };
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason && e.reason.stack ? e.reason.stack : (e.reason && e.reason.message ? e.reason.message : String(e.reason || 'שגיאה לא ידועה'));
        console.error('[Crash] unhandledrejection:', e.reason);
        window.__showCrashOverlay(msg);
      });
      // פולבק: אם הממשק לא נטען אחרי 8 שניות — מסך שגיאה
      // בודק גובה ממשי ולא רק firstChild, למקרה שReact עשה mount חלקי ללא תוכן נראה
      window.__mountTimer = setTimeout(function() {
        var appEl = document.getElementById('app');
        if (!appEl) { window.__showCrashOverlay('אלמנט #app לא נמצא בדף.'); return; }
        var rect = appEl.getBoundingClientRect();
        if (rect.height < 50) {
          window.__showCrashOverlay('הממשק לא נטען תוך זמן סביר. גובה=0 (CSS לא נטען או שגיאת React). נסה לפתוח DevTools עם F12 לפרטים.');
        }
      }, 8000);
    </script>
    <script type="module" src="./src/main.jsx"></script>
</body>
</html>
